# ============================================================
# E-Commerce Platform — Spring Boot Production Profile (prod)
# ============================================================
# Activate with: SPRING_PROFILES_ACTIVE=prod
# ============================================================

# ─── JPA / Hibernate Production Settings ─────────────────────
# Strictly validate JPA entity mapping against database schema.
# Never alter schema or truncate data in production.
spring.jpa.hibernate.ddl-auto=validate

# Suppress raw SQL queries in production console logs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Production Logging Levels ───────────────────────────────
logging.level.root=INFO
logging.level.com.ecommerce=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN

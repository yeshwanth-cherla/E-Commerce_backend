# ============================================================
# E-Commerce Platform — Spring Boot Application Properties
# ============================================================
# Credentials are loaded from environment variables.
# Set them in your local .env file (git-ignored).
# ============================================================

# ─── Environment Configuration ────────────────────────────────
# Load root .env file automatically using Spring Boot 3 config import
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# ─── Server ──────────────────────────────────────────────────
server.port=${PORT:${SERVER_PORT:8080}}

# ─── Application Info ────────────────────────────────────────
spring.application.name=ecommerce-backend

# ─── Datasource (Supabase PostgreSQL) ────────────────────────
# DATABASE_URL must be in JDBC format:
#   jdbc:postgresql://db.<ref>.supabase.co:5432/postgres?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── HikariCP Connection Pool ────────────────────────────────
# Conservative pool size for Supabase free tier (max 60 direct connections)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=EcommerceHikariPool

# ─── JPA / Hibernate ─────────────────────────────────────────
#
# ddl-auto=update is used during development because it is NON-DESTRUCTIVE:
#   - Creates tables that do not yet exist
#   - Adds missing columns to existing tables
#   - Does NOT drop tables, columns, or constraints
#   - Does NOT truncate data
#
# This is safe for a fresh Supabase database and incremental development.
#
# IMPORTANT: Change to 'validate' (or 'none') before production deployment.
#
# Configurable DDL auto mode (default: update)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Force Hibernate to use the PostgreSQL dialect explicitly
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Show SQL in dev logs (disable in production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Defer datasource initialization so Hibernate runs first
spring.jpa.defer-datasource-initialization=false

# Disable open-in-view (avoids lazy-loading issues in controllers)
spring.jpa.open-in-view=false

# ─── Security ────────────────────────────────────────────────
# OAuth2 Resource Server — Supabase JWT validation (configured in Stage 05)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER_URI}

# CORS Allowed Origins (comma-separated list, default: http://localhost:5173)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ─── Logging ─────────────────────────────────────────────────
logging.level.com.ecommerce=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=INFO
